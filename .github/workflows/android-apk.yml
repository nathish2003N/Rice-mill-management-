
name: Build Rice Mill Android APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract project
        run: |
          mkdir source
          unzip rice_mill_manager_v2_android.zip -d source
          mkdir app
          flutter create --platforms=android app
          cp source/lib/main.dart app/lib/main.dart
          cp source/pubspec.yaml app/pubspec.yaml

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rice-Mill-Manager-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          
